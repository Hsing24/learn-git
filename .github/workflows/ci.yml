name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python CLI acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run CLI acceptance and curriculum consistency tests
        run: python3 -u tests/test_all_scenarios.py -v

  web:
    name: Web syntax and scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: |
          for file in docs/*.js; do
            node --check "$file"
          done
      - name: Run Web scenario acceptance tests
        run: node tests/web/run_scenarios.mjs
